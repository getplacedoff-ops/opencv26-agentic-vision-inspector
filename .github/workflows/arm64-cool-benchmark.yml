name: AWS Graviton4 Arm64 & COOL OpenCV Verification

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  arm64-cool-verification:
    name: Arm64 Neoverse / COOL SIMD Benchmark & Unit Suite
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11 on Arm64
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install OpenCV & Scientific Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Arm64 Architecture & OpenCV SIMD Introspection
        run: |
          uname -m
          python cool_benchmark_profiler.py

      - name: Run 12-Test Agentic Vision & MCP Verification Suite
        run: |
          python test_suite.py

      - name: Run Full 60-Scene + Real Industrial Micrograph Evaluation
        run: |
          python evaluate.py
